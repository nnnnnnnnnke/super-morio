# スーパモリオ - サーバ権威型アクションゲーム (port 8081)
#
# ゲームは常駐サービス(gevent, 127.0.0.1:5001)が 60Hz で世界を進めている。
# WebSocket が使えれば入力は押した瞬間に届き、状態は 30Hz でプッシュされる。
# proxy_buffering off と長い read_timeout が無いと、押しっぱなしの間に
# 切断されるので注意。
map $http_upgrade $morio_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8081 default_server;
    listen [::]:8081 default_server;
    server_name _;

    root /opt/yohtube/morio;
    index index.html;
    access_log off;

    location /game/ {
        proxy_pass http://127.0.0.1:5001/game/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $morio_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
